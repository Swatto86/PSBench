name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags (v1.0.0, v1.2.3, etc.)

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Verify required files
        shell: pwsh
        run: |
          $required = @('LICENSE', 'psbench.ico', 'installer.nsi', 'PSBench.csproj')
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Required file missing: $file"
              exit 1
            }
          }
          Write-Host "✓ All required files present"
      
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"
      
      - name: Restore dependencies
        run: dotnet restore PSBench.csproj
      
      - name: Publish application (framework-dependent)
        run: |
          dotnet publish PSBench.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o bin/publish
      
      - name: Publish portable single exe (self-contained)
        shell: pwsh
        run: |
          dotnet publish PSBench.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o bin/portable

          $ver = "${{ steps.version.outputs.VERSION }}"
          New-Item -ItemType Directory -Force -Path "bin\dist" | Out-Null
          $exe = "bin\portable\PSBench.exe"
          if (-not (Test-Path $exe)) { Write-Error "Portable exe not found at $exe"; exit 1 }
          $out = "bin\dist\PSBench_${ver}_x64-portable.exe"
          Copy-Item $exe $out -Force
          $sizeMB = [math]::Round((Get-Item $out).Length / 1MB, 2)
          Write-Host "✓ Portable exe: $out ($sizeMB MB)"

      - name: Install NSIS
        run: |
          choco install nsis -y
          # Add NSIS to PATH for subsequent steps
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
      
      - name: Build NSIS installer
        shell: pwsh
        run: |
          # Ensure installer output directory exists
          New-Item -ItemType Directory -Force -Path "bin\installer" | Out-Null
          
          # Build the installer
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "NSIS build failed with exit code $LASTEXITCODE"
            exit 1
          }
          
          # Verify installer was created
          $installerPath = "bin\installer\PSBench-${{ steps.version.outputs.VERSION }}-Setup.exe"
          if (-not (Test-Path $installerPath)) {
            Write-Error "Installer not found at: $installerPath"
            exit 1
          }
          
          $sizeMB = [math]::Round((Get-Item $installerPath).Length / 1MB, 2)
          Write-Host "✓ Installer built: $installerPath ($sizeMB MB)"
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PSBench ${{ steps.version.outputs.VERSION }}
          body: |
            ## PSBench ${{ steps.version.outputs.VERSION }}
            
            ### Installation

            **Installer** (recommended)
            1. Download `PSBench-${{ steps.version.outputs.VERSION }}-Setup.exe`
            2. Run the installer (detects/offers .NET 8.0 Desktop Runtime if missing)
            3. Launch PSBench from the Start Menu

            **Portable** — download `PSBench_${{ steps.version.outputs.VERSION }}_x64-portable.exe` and run it directly. Self-contained: no .NET runtime or install required.

            ### Requirements

            - Windows 10 x64 or higher
            - .NET 8.0 Desktop Runtime (installer only; portable exe bundles it)
            - PowerShell 5.0 or higher
            
            ### What's Changed
            
            See the commit history for details.
          files: |
            bin/installer/PSBench-${{ steps.version.outputs.VERSION }}-Setup.exe
            bin/dist/PSBench_${{ steps.version.outputs.VERSION }}_x64-portable.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Summary
        shell: pwsh
        run: |
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" -ForegroundColor Green
          Write-Host "  Release ${{ github.ref_name }} published successfully!" -ForegroundColor Green
          Write-Host "  Installer: PSBench-${{ steps.version.outputs.VERSION }}-Setup.exe" -ForegroundColor Green
          Write-Host "  URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" -ForegroundColor Green
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" -ForegroundColor Green
